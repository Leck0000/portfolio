name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check index.html exists
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found in repository root"
            exit 1
          fi
          echo "index.html found"
      
      - name: Check index.html is non-empty
        run: |
          size=$(wc -c < index.html)
          if [ "$size" -eq 0 ]; then
            echo "ERROR: index.html is empty"
            exit 1
          fi
          echo "index.html size: $size bytes"

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    environment: vercel
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--confirmed'
          working-directory: ./
          github-token: ${{ secrets.GITHUB_TOKEN }}
        id: deploy

  vercel-url:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Display Vercel URL
        run: echo "Deployed to: ${{ needs.deploy.outputs.url }}"
